<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Ads - HappyFood Admin</title>
  
  <meta name="description" content="Admin ad management panel.">
  <meta name="theme-color" content="#F2A541">
  <script>
    if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          registrations.forEach((registration) => registration.unregister());
        }).catch(() => {});
      }

      if ('caches' in window) {
        caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key)))).catch(() => {});
      }
    }
  </script>
  <link rel="manifest" href="/manifest.json?v=20260313c">
  <link rel="icon" type="image/png" href="/icons/icon-192.png?v=20260313c">
  <link rel="apple-touch-icon" href="/icons/icon-192.png?v=20260313c">

  <!-- Theme Script (Must load first) -->
  <script src="js/theme.js?v=20260313c"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/design-system.css?v=20260313c">
  <link rel="stylesheet" href="css/feed.css?v=20260313c">
  <link rel="stylesheet" href="css/manage-ads.css?v=20260313c">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="feed-page">

  <!-- DESKTOP SIDEBAR -->
  <aside class="desktop-sidebar">
    <div class="sidebar-logo">HappyFood</div>
    <nav style="display: flex; flex-direction: column; gap: 10px;">
      <a href="feed.html" class="nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        Feed
      </a>
      <a href="create-post.html" class="nav-item admin-create-btn is-admin">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        New Post
      </a>
      <a href="manage-ads.html" class="nav-item active">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path></svg>
        Manage Ads
      </a>
      <a href="profile.html" class="nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        Profile
      </a>
    </nav>
    <a href="#" onclick="handleLogout(event)" class="nav-item logout-btn">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
      Logout
    </a>
    <button class="sidebar-theme-toggle theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">🌙</button>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content" style="max-width: 900px;">

    <!-- Page Header -->
    <div class="ads-page-header">
      <div>
        <h1 class="ads-page-title">Ad Manager</h1>
        <p class="ads-page-subtitle">Create and manage sponsored content for local businesses</p>
      </div>
      <button class="btn-create-ad" onclick="showAdModal()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        New Ad
      </button>
    </div>

    <!-- Quick Stats -->
    <div class="ads-stats-row">
      <div class="stat-card">
        <div class="stat-number" id="totalAdsCount">0</div>
        <div class="stat-label">Total Ads</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="activeAdsCount">0</div>
        <div class="stat-label">Active</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="totalClicks">0</div>
        <div class="stat-label">Total Clicks</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="totalImpressions">0</div>
        <div class="stat-label">Impressions</div>
      </div>
    </div>

    <!-- Ad List -->
    <div class="ads-list" id="adsList">
      <div class="skeleton" style="height: 120px; border-radius: 16px;"></div>
      <div class="skeleton" style="height: 120px; border-radius: 16px;"></div>
    </div>

    <!-- Empty State -->
    <div class="ads-empty" id="adsEmpty" style="display: none;">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path></svg>
      <h3>No ads yet</h3>
      <p>Create your first ad to start promoting local businesses.</p>
    </div>

  </main>

  <!-- AD CREATE/EDIT MODAL -->
  <div class="ad-modal-overlay" id="adModalOverlay">
    <div class="ad-modal">
      <div class="ad-modal-header">
        <h2 id="adModalTitle">Create New Ad</h2>
        <button class="ad-modal-close" onclick="hideAdModal()">&times;</button>
      </div>
      
      <form id="adForm" onsubmit="handleAdSubmit(event)">
        <input type="hidden" id="adEditId" value="">

        <div class="ad-form-group">
          <label for="adTitle">Ad Title *</label>
          <input type="text" id="adTitle" placeholder="e.g. 20% Off at Silvassa Kitchen" required>
        </div>

        <div class="ad-form-group">
          <label for="adBusinessName">Business Name</label>
          <input type="text" id="adBusinessName" placeholder="e.g. Silvassa Kitchen Restaurant">
        </div>

        <div class="ad-form-group">
          <label for="adDescription">Description</label>
          <textarea id="adDescription" placeholder="Short description about the offer..." rows="3"></textarea>
        </div>

        <div class="ad-form-group">
          <label for="adLinkUrl">Link URL (where to send clicks)</label>
          <input type="text" id="adLinkUrl" placeholder="https://example.com or instagram.com/shop">
        </div>

        <!-- Media Upload -->
        <div class="ad-form-group">
          <label>Ad Media (Image or Video) *</label>
          <div class="ad-upload-zone" id="adUploadZone" onclick="document.getElementById('adFileInput').click()">
            <input type="file" id="adFileInput" accept="image/*,video/mp4,video/webm" style="display: none;">
            <div class="ad-upload-placeholder" id="adUploadPlaceholder">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              <span>Click to upload image or video</span>
            </div>
            <div class="ad-upload-preview" id="adUploadPreview" style="display: none;"></div>
          </div>
        </div>

        <div class="ad-form-row">
          <div class="ad-form-group">
            <label for="adPlacement">Placement</label>
            <select id="adPlacement">
              <option value="both">Feed + Sidebar</option>
              <option value="feed">Feed Only</option>
              <option value="sidebar">Sidebar Only</option>
            </select>
          </div>
          <div class="ad-form-group">
            <label for="adEndsAt">Expires On (optional)</label>
            <input type="date" id="adEndsAt">
          </div>
        </div>

        <div class="ad-form-actions">
          <button type="button" class="btn-cancel" onclick="hideAdModal()">Cancel</button>
          <button type="submit" class="btn-publish" id="adSubmitBtn">
            <span class="btn-text">Publish Ad</span>
            <span class="spinner"></span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/config.js?v=20260313c"></script>
  <script src="js/utils.js?v=20260313c"></script>
  <script src="js/manage-ads.js?v=20260313c"></script>

</body>
</html>
